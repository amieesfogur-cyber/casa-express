<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>توصيل سريع الدار البيضاء</title>
</head>
<h2>📦 طلب التوصيل</h2>

<form>
    <input type="text" placeholder="الاسم الكامل"><br><br>
    <input type="tel" placeholder="رقم الهاتف"><br><br>
    <input type="text" placeholder="مكان الاستلام"><br><br>
    <input type="text" placeholder="مكان التوصيل"><br><br>

    <button type="submit">إرسال الطلب</button>
</form><form onsubmit="sendWhatsApp(); return false;">
<body>

<h1>🚴‍♂️ خدمة التوصيل السريع</h1>
<link rel="stylesheet" href="style.css">
<p>توصيل سريع وآمن داخل مدينة الدار البيضاء</p>

<h2>خدماتنا</h2>
<ul>
<li>📦 توصيل الطلبات</li>
<li>📄 توصيل الوثائق</li>
<li>🛒 المشتريات</li>
</ul>

<a href="https://wa.me/212624581369" target="_blank">
    📲 اطلب عبر واتساب
</a>
<script>
function sendWhatsApp() {
    let name = document.querySelectorAll("input")[0].value;
    let phone = document.querySelectorAll("input")[1].value;
    let from = document.querySelectorAll("input")[2].value;
    let to = document.querySelectorAll("input")[3].value;

    let message = "طلب توصيل جديد%0A" +
    "الاسم: " + name + "%0A" +
    "الهاتف: " + phone + "%0A" +
    "من: " + from + "%0A" +
    "إلى: " + to;

    window.open("https://wa.me/212624581369?text=" + message);
}
</script>
</body>
</html>
